<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#120826">
<title>Rhyme Kingdom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Lexend:wght@400;600;800&family=Sedgwick+Ave+Display&display=swap">
<style>
/* Rhyme Kingdom
 * Layout: one phone-shaped stage, centered over a night-city backdrop on wide screens.
 * Look: neon night on the block, royal gold trim, sticker-style ink outlines.
 * Single deliberate dark theme. */
:root {
  --ink: #1d0f33;
  --night: #120826;
  --plum: #2a1652;
  --plum-2: #3a1f6e;
  --gold: #ffc531;
  --gold-deep: #e09400;
  --pink: #ff3b8d;
  --cyan: #22e3ff;
  --mint: #3bff8a;
  --cream: #fff4dc;
  --muted: #bfaee3;
  --danger: #ff3b5c;
  --sky-top: #160a36;
  --sky-bottom: #4a1d6e;
  --font-graffiti: 'Sedgwick Ave Display', 'Bungee', Impact, 'Arial Black', sans-serif;
  --font-sign: 'Bungee', Impact, 'Arial Black', sans-serif;
  --font-body: 'Lexend', 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
  --gutter: 16px;
  color-scheme: dark;
}

[hidden] { display: none !important; }
html { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background:
    radial-gradient(ellipse at 50% 120%, rgba(255, 59, 141, .28), transparent 60%),
    repeating-linear-gradient(0deg, rgba(0, 0, 0, .18) 0 1px, transparent 1px 22px),
    repeating-linear-gradient(90deg, rgba(0, 0, 0, .14) 0 1px, transparent 1px 44px),
    #24123f;
  color: var(--cream);
  font-family: var(--font-body);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  touch-action: manipulation;
}
body[data-chapter="shop"] { --sky-top: #1a0b2e; --sky-bottom: #4b1450; }
body[data-chapter="blacktop"] { --sky-top: #0d1b3d; --sky-bottom: #2d3a7a; }
body[data-chapter="wall"] { --sky-top: #12081f; --sky-bottom: #3d1f5c; }
body[data-chapter="arena"] { --sky-top: #0c0620; --sky-bottom: #3a0f52; }

#app {
  position: relative;
  height: 100%;
  max-width: 520px;
  margin: 0 auto;
  overflow: hidden;
  background: linear-gradient(180deg, var(--sky-top), var(--sky-bottom) 70%, #2a0f45);
  box-shadow: 0 0 0 3px var(--ink), 0 0 60px rgba(255, 59, 141, .35);
}
.backdrop { position: absolute; inset: 0; pointer-events: none; }
.skyline { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 34%; }
#eq { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 70px; opacity: .45; }
#fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }

.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  padding-inline: var(--gutter);
  padding-block: 12px 14px;
  z-index: 2;
}

/* ---------------------------------------------------------------- buttons */
button { font: inherit; color: inherit; }
.btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-family: var(--font-sign);
  font-size: 15px;
  letter-spacing: .02em;
  color: var(--ink);
  border: 3px solid var(--ink);
  border-radius: 16px;
  padding: 10px 18px;
  background: linear-gradient(180deg, #fff, #e8e2f5);
  box-shadow: 0 5px 0 var(--ink), inset 0 2px 0 rgba(255, 255, 255, .6);
  cursor: pointer;
  transition: transform .08s ease, box-shadow .08s ease, filter .15s ease;
}
.btn:active:not([disabled]) { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink), inset 0 2px 0 rgba(255, 255, 255, .6); }
.btn:focus-visible, .icon-btn:focus-visible, .booster:focus-visible, .toggle:focus-visible, .lv:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }
.btn img { width: 18px; height: 18px; }
.btn-gold { background: linear-gradient(180deg, #ffe683, var(--gold) 55%, var(--gold-deep)); }
.btn-pink { background: linear-gradient(180deg, #ff8cc0, var(--pink) 60%, #d0176a); color: #fff; text-shadow: 0 2px 0 var(--ink); }
.btn-plum { background: linear-gradient(180deg, #634199, var(--plum-2)); color: var(--cream); }
.btn-ghost { background: transparent; color: var(--muted); border-color: transparent; box-shadow: none; }
.btn-big { font-size: 20px; padding: 12px 26px; border-radius: 20px; }
.btn-small { font-size: 13px; padding: 6px 12px; border-radius: 12px; box-shadow: 0 3px 0 var(--ink); }
.btn[disabled] { filter: grayscale(.85) brightness(.75); cursor: not-allowed; }
.btn.btn-ghost { box-shadow: none; }
.btn-kicker { display: block; font-family: var(--font-body); font-weight: 800; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; opacity: .75; }

.icon-btn {
  width: 44px; height: 44px;
  display: grid; place-items: center;
  border-radius: 14px;
  border: 3px solid var(--ink);
  background: linear-gradient(180deg, #634199, var(--plum-2));
  box-shadow: 0 4px 0 var(--ink);
  cursor: pointer;
  flex: none;
}
.icon-btn svg { width: 24px; height: 24px; fill: var(--cream); }
.icon-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--ink); }

.tag {
  display: inline-block;
  font-family: var(--font-sign);
  font-size: 11px;
  letter-spacing: .04em;
  padding: 3px 8px;
  border-radius: 999px;
  border: 2px solid var(--ink);
  vertical-align: middle;
  margin-left: 6px;
}
.tag-hard { background: var(--danger); color: #fff; }
.tag-super { background: linear-gradient(90deg, #9b1dff, var(--danger)); color: #fff; }

/* ------------------------------------------------------------------ title */
#scr-title { justify-content: center; align-items: center; text-align: center; }
.title-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
.presents { margin: 0; font-weight: 800; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.logo { margin: 0; line-height: .9; display: flex; flex-direction: column; align-items: center; }
.logo-rhyme {
  font-family: var(--font-graffiti);
  font-weight: 400;
  font-size: clamp(64px, 22vw, 112px);
  background: linear-gradient(180deg, #fff6c2 10%, var(--gold) 45%, #ff8a3d 80%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(3px 0 0 var(--ink)) drop-shadow(-3px 0 0 var(--ink)) drop-shadow(0 3px 0 var(--ink)) drop-shadow(0 -3px 0 var(--ink)) drop-shadow(0 6px 0 var(--pink));
  transform: rotate(-4deg);
  padding: 0 .1em;
}
.logo-kingdom {
  font-family: var(--font-sign);
  font-size: clamp(26px, 9vw, 44px);
  letter-spacing: .14em;
  color: var(--cyan);
  text-shadow: 0 3px 0 var(--ink), 0 0 18px rgba(34, 227, 255, .7);
  margin-top: 4px;
}
.tagline { margin: 0; font-weight: 600; color: var(--cream); }
.title-cast { position: relative; height: 150px; width: 260px; margin: 6px 0 10px; }
.title-cast img { position: absolute; bottom: 0; width: 120px; height: 120px; animation: bob 2.4s ease-in-out infinite; filter: drop-shadow(0 6px 0 rgba(0, 0, 0, .35)); }
.title-cast .cast-0 { left: 0; animation-delay: -.6s; }
.title-cast .cast-1 { left: 70px; bottom: 22px; width: 130px; height: 130px; z-index: 1; }
.title-cast .cast-2 { right: 0; animation-delay: -1.2s; }
.title-foot { margin: 6px 0 0; font-size: 12px; color: var(--muted); }
#btn-start { animation: pulse 1.6s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-6px); } }
@keyframes pulse { 50% { transform: scale(1.05); } }

/* ------------------------------------------------------------------- home */
.topbar { display: flex; align-items: center; gap: 10px; }
.pill {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 12px 4px 6px;
  border-radius: 999px;
  border: 3px solid var(--ink);
  background: rgba(20, 8, 38, .75);
  font-family: var(--font-sign);
  font-size: 16px;
  font-variant-numeric: tabular-nums;
}
.pill img { width: 26px; height: 26px; }
.topbar .icon-btn { margin-left: auto; }
.home-main { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; }
.area-head { text-align: center; margin-top: 10px; }
.kicker { margin: 0; font-weight: 800; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.area-name {
  margin: 2px 0 6px;
  font-family: var(--font-graffiti);
  font-weight: 400;
  font-size: clamp(30px, 9vw, 42px);
  color: var(--gold);
  text-shadow: 0 3px 0 var(--ink), 0 0 16px rgba(255, 197, 49, .45);
  text-wrap: balance;
}
.area-progress { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 12px; font-weight: 600; color: var(--muted); }
.area-progress .bar { width: 140px; height: 10px; border-radius: 999px; background: rgba(0, 0, 0, .4); border: 2px solid var(--ink); overflow: hidden; }
.area-progress .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--pink), var(--gold)); transition: width .5s ease; }
.scene {
  position: relative;
  margin-top: 12px;
  width: 100%;
  aspect-ratio: 400 / 260;
  max-width: 100%;
  border-radius: 20px;
  overflow: hidden;
  border: 3px solid var(--ink);
  box-shadow: 0 0 0 3px var(--gold), 0 10px 30px rgba(0, 0, 0, .5);
  flex: none;
}
.scene .scene-svg { display: block; width: 100%; height: 100%; }
.build-item { opacity: .16; filter: grayscale(1) brightness(1.6); transition: opacity .4s ease, filter .4s ease; }
.build-item.built { opacity: 1; filter: none; }
.build-item.just-built { transform-box: fill-box; transform-origin: 50% 100%; animation: buildPop .7s cubic-bezier(.2, 1.6, .4, 1); }
@keyframes buildPop { 0% { transform: scale(.2); opacity: 0; } 60% { transform: scale(1.12); opacity: 1; } 100% { transform: scale(1); } }
.host-row { display: flex; align-items: flex-end; gap: 10px; margin-top: 14px; }
.host-face { width: 88px; height: 88px; flex: none; filter: drop-shadow(0 4px 0 rgba(0, 0, 0, .35)); }
.bubble {
  position: relative;
  flex: 1;
  min-width: 0;
  background: var(--cream);
  color: var(--ink);
  border: 3px solid var(--ink);
  border-radius: 16px 16px 16px 4px;
  padding: 8px 12px;
  box-shadow: 0 4px 0 var(--ink);
  font-size: 14px;
  line-height: 1.35;
}
.bubble p { margin: 0; }
.bubble-name { font-family: var(--font-sign); font-size: 11px; letter-spacing: .04em; color: #7b2cff; margin-bottom: 2px !important; }
.chapter-path { padding-top: 12px; text-align: center; }
.path { list-style: none; margin: 10px 0 0; padding: 0; display: flex; justify-content: space-between; align-items: center; position: relative; }
.path::before { content: ''; position: absolute; left: 22px; right: 22px; top: 50%; height: 6px; transform: translateY(-50%); border-radius: 999px; background: repeating-linear-gradient(90deg, rgba(255, 255, 255, .25) 0 10px, transparent 10px 18px); }
.stop {
  position: relative;
  width: 44px; height: 44px;
  border-radius: 50%;
  display: grid; place-items: center;
  border: 3px solid var(--ink);
  background: linear-gradient(180deg, #5a3a9a, var(--plum-2));
  box-shadow: 0 3px 0 var(--ink);
  font-family: var(--font-sign);
  font-size: 16px;
}
.stop.done { background: linear-gradient(180deg, #ffe683, var(--gold) 60%, var(--gold-deep)); color: var(--ink); }
.stop.current { background: linear-gradient(180deg, #ff8cc0, var(--pink)); box-shadow: 0 0 0 4px rgba(255, 59, 141, .35), 0 3px 0 var(--ink); animation: pulse 1.4s ease-in-out infinite; }
.stop.boss { width: 52px; height: 52px; border-color: var(--danger); }
.stop.boss > img:first-child { position: absolute; inset: -6px; width: calc(100% + 12px); height: calc(100% + 12px); opacity: .9; }
.stop.boss b { position: absolute; bottom: -10px; font-size: 12px; background: var(--danger); color: #fff; border: 2px solid var(--ink); border-radius: 999px; padding: 0 6px; }
.stop-star { position: absolute; top: -10px; right: -8px; width: 22px; height: 22px; }
.home-actions { display: flex; gap: 12px; margin-top: 16px; align-items: stretch; }
.home-actions #btn-build { flex: 0 0 auto; }
.home-actions #btn-play { flex: 1; flex-direction: column; gap: 0; line-height: 1.15; }
#btn-build.ready { animation: pulse 1.3s ease-in-out infinite; }
#btn-build.ready::after {
  content: '';
  position: absolute; top: -7px; right: -7px;
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--gold); border: 3px solid var(--ink);
}

/* ------------------------------------------------------------------- game */
#scr-game { padding-bottom: 10px; }
.hud { display: flex; align-items: center; gap: 10px; }
.hud-moves {
  flex: none;
  width: 70px; height: 70px;
  border-radius: 50%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: radial-gradient(circle at 40% 30%, #6d48b0, var(--plum) 70%);
  border: 3px solid var(--ink);
  box-shadow: 0 0 0 3px var(--gold), 0 5px 0 3px var(--ink);
}
.hud-moves .label { font-size: 10px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.hud-moves b { font-family: var(--font-sign); font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums; }
.hud-moves.low b { color: var(--danger); animation: pulse .7s ease-in-out infinite; }
.hud-goals {
  flex: 1;
  min-width: 0;
  display: flex; justify-content: center; gap: 6px;
  padding: 6px;
  border-radius: 18px;
  background: rgba(20, 8, 38, .78);
  border: 3px solid var(--ink);
  box-shadow: inset 0 0 0 2px rgba(255, 197, 49, .35);
}
.goal { position: relative; display: flex; flex-direction: column; align-items: center; min-width: 46px; }
.goal img { width: 40px; height: 40px; }
.goal b { font-family: var(--font-sign); font-size: 16px; line-height: 1.1; font-variant-numeric: tabular-nums; text-shadow: 0 2px 0 var(--ink); }
.goal.done b { color: var(--mint); font-size: 0; }
.goal.done b::after { content: '\2713'; font-size: 18px; }
.goal.bump img { animation: goalBump .25s ease; }
@keyframes goalBump { 50% { transform: scale(1.28); } }
.hud-sub { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 8px; min-height: 22px; font-family: var(--font-sign); font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.hud-sub .tag { margin-left: 0; }
.boss-timer { font-family: var(--font-body); font-weight: 800; font-size: 12px; color: #ffd0da; background: rgba(255, 59, 92, .18); border: 2px solid rgba(255, 59, 92, .5); padding: 2px 8px; border-radius: 999px; }
.boss-timer.soon { background: var(--danger); color: #fff; animation: pulse .6s ease-in-out infinite; }
.board-wrap { position: relative; flex: 1; min-height: 0; margin-top: 6px; }
#board { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
.coach {
  position: relative;
  margin-top: 8px;
  display: flex; align-items: center; gap: 8px;
  padding: 6px 10px 6px 6px;
  background: var(--cream); color: var(--ink);
  border: 3px solid var(--ink); border-radius: 16px;
  box-shadow: 0 4px 0 var(--ink);
  z-index: 5;
  pointer-events: none;
  animation: coachIn .35s ease;
}
.coach img { width: 48px; height: 48px; flex: none; }
.coach p { margin: 0; font-weight: 600; font-size: 14px; line-height: 1.3; }
@keyframes coachIn { from { transform: translateY(-10px); opacity: 0; } }
.toast {
  align-self: center;
  margin: 6px 0 2px;
  padding: 6px 14px;
  border-radius: 999px;
  background: rgba(34, 227, 255, .16);
  border: 2px solid var(--cyan);
  color: var(--cream);
  font-weight: 600;
  font-size: 13px;
  text-align: center;
}
.boosters { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
.booster {
  position: relative;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 6px 2px 4px;
  border-radius: 16px;
  border: 3px solid var(--ink);
  background: linear-gradient(180deg, #4b2c86, var(--plum));
  box-shadow: 0 4px 0 var(--ink);
  cursor: pointer;
}
.booster img { width: 38px; height: 38px; }
.booster small { font-size: 10px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.booster .count {
  position: absolute; top: -8px; right: -6px;
  min-width: 22px; height: 22px; padding: 0 5px;
  border-radius: 999px;
  background: var(--gold); color: var(--ink);
  border: 2px solid var(--ink);
  font-family: var(--font-sign); font-size: 12px; line-height: 18px;
}
.booster.empty .count { background: var(--mint); }
.booster.active { background: linear-gradient(180deg, #1fb8d6, #0b6f8f); box-shadow: 0 0 0 3px var(--cyan), 0 4px 0 var(--ink); }
.booster.active small { color: #fff; }
.booster:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--ink); }

/* ----------------------------------------------------------------- modals */
.modal {
  position: absolute; inset: 0;
  z-index: 40;
  display: flex;
  padding: var(--gutter);
  background: rgba(10, 4, 24, .72);
  -webkit-backdrop-filter: blur(4px);
  backdrop-filter: blur(4px);
  animation: fade .2s ease;
  overflow-y: auto;
}
@keyframes fade { from { opacity: 0; } }
.modal-card {
  position: relative;
  width: 100%;
  max-width: 380px;
  margin: auto;
  padding: 22px 18px 18px;
  border-radius: 24px;
  background: linear-gradient(180deg, #3d2273, var(--plum));
  border: 3px solid var(--ink);
  box-shadow: 0 0 0 3px var(--gold), 0 14px 40px rgba(0, 0, 0, .6);
  text-align: center;
  animation: pop .35s cubic-bezier(.2, 1.5, .4, 1);
}
.modal-card.celebrate { box-shadow: 0 0 0 3px var(--gold), 0 0 50px rgba(255, 197, 49, .55); }
@keyframes pop { from { transform: scale(.7); opacity: 0; } }
.modal-title { margin: 0 0 6px; font-family: var(--font-sign); font-weight: 400; font-size: 24px; color: var(--gold); text-shadow: 0 3px 0 var(--ink); text-wrap: balance; }
.modal-kicker { margin: 0 0 4px; font-weight: 800; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.modal-sub { margin: 6px 0; color: var(--muted); font-size: 14px; }
.modal-text { margin: 8px auto; max-width: 32ch; line-height: 1.45; font-size: 15px; }
.modal-actions { display: flex; gap: 10px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
.modal-actions-col { flex-direction: column; align-items: stretch; }
.level-face { width: 110px; height: 110px; margin: -6px auto 2px; display: block; filter: drop-shadow(0 5px 0 rgba(0, 0, 0, .35)); }
.level-name { margin: 0 0 10px; font-family: var(--font-graffiti); font-size: 26px; color: var(--cyan); text-shadow: 0 2px 0 var(--ink); }
.goal-list, .reward-list { list-style: none; padding: 0; margin: 8px 0; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
.goal-list li, .reward-list li {
  display: flex; flex-direction: column; align-items: center;
  min-width: 78px;
  padding: 8px 6px;
  border-radius: 16px;
  background: rgba(10, 4, 24, .45);
  border: 2px solid rgba(255, 255, 255, .08);
}
.goal-list img, .reward-list img { width: 46px; height: 46px; }
.goal-list b, .reward-list b { font-family: var(--font-sign); font-size: 20px; }
.goal-list span, .reward-list span { font-size: 11px; color: var(--muted); font-weight: 600; }
.new-badge { display: inline-block; margin: 0 0 6px; padding: 3px 12px; border-radius: 999px; background: var(--pink); border: 2px solid var(--ink); font-family: var(--font-sign); font-size: 13px; transform: rotate(-4deg); }
.intro-art { width: 110px; height: 110px; display: block; margin: 0 auto 4px; }
.build-list { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; text-align: left; }
.build-row { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 12px; border-radius: 14px; background: rgba(10, 4, 24, .45); }
.build-row.done { opacity: .7; }
.build-name { flex: 1; min-width: 0; font-weight: 600; }
.build-done { font-family: var(--font-sign); font-size: 12px; color: var(--mint); padding-right: 6px; }
.win-burst { margin: 0; font-family: var(--font-graffiti); font-size: clamp(30px, 9vw, 40px); color: var(--gold); text-shadow: 0 3px 0 var(--ink), 0 0 20px rgba(255, 197, 49, .6); transform: rotate(-3deg); }
.win-face { width: 120px; height: 120px; display: block; margin: 4px auto; animation: bob 1.6s ease-in-out infinite; }
.win-hype { margin: 4px auto 10px; max-width: 30ch; font-weight: 600; line-height: 1.4; }
.win-hype span { display: block; font-size: 12px; color: var(--muted); font-weight: 400; margin-top: 2px; }
.toggles { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.toggle {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid rgba(255, 255, 255, .08);
  background: rgba(10, 4, 24, .45);
  cursor: pointer;

.credits { margin: 14px 0 0; font-size: 12px; color: var(--muted); line-height: 1.4; }
.lv-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 10px; }
.lv {

.dialog {

  z-index: 50;

@keyframes slideIn { from { transform: translateX(-24px); opacity: 0; } }

@keyframes confetti { to { transform: translate(var(--x), 420px) rotate(var(--r)); opacity: 0; } }

<script>
/*
 * Rhyme Kingdom: match-3 rules engine.
 *
 * Pure game logic with no DOM and no timers. Every player action resolves
 * synchronously and returns a list of events that the renderer plays back.
 * Runs in the browser (window.RKEngine) and in Node (require) so levels can
 * be balanced with a headless bot.
 *
 * Tile colors: 0 mic (red), 1 sneaker (orange), 2 chain (yellow),
 *              3 cap (green), 4 headphones (blue), 5 cassette (purple)
 * Power-ups:   h / v  spray can (row / column)
 *              x      boombox (blast)
 *              pl     flyer (paper plane that seeks a goal)
 *              d      platinum record (clears one color)
 */
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.RKEngine = api;
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  // Timing used for event scheduling (ms). The renderer reads these too.
  const T = {
    SPRAY: 30,     // per cell travelled by a spray can
    FUSE: 70,      // delay between a power-up being hit and firing
    BOOM: 120,     // boombox wind-up
    RING: 34,      // per ring of a blast
    PLANE: 520,    // flyer flight time
    DISC: 26,      // between platinum beams
    CONVERT: 45,   // between conversions in a platinum combo
  };

  const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  const COLOR_CHARS = { R: 0, O: 1, Y: 2, G: 3, B: 4, P: 5 };
  const POWER_CHARS = { h: 'h', v: 'v', x: 'x', p: 'pl', d: 'd' };

  class Engine {
    constructor(level, seed) {
      this.level = level;
      this.rs = (seed >>> 0) || 1;
      this.nid = 1;
      this.silent = false;
      this.ev = [];
      this.status = 'playing';
      this.moves = level.moves;
      this.movesUsed = 0;
      this.encoreMode = false;
      this.staticHit = false;
      this.colors = (level.colors || [0, 1, 2, 3, 4]).slice();
      this._pend = new Map();
      this._parse();
      this._initialFill();
    }

    // ---------- random ----------
    rand() {
      let t = (this.rs = (this.rs + 0x6d2b79f5) | 0);
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }
    ri(n) { return Math.floor(this.rand() * n); }
    pick(a) { return a[this.ri(a.length)]; }
    shuffleArr(a) {
      for (let i = a.length - 1; i > 0; i--) {
        const j = this.ri(i + 1);
        const t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    }

    // ---------- events ----------
    emit(e) { if (!this.silent) this.ev.push(e); }
    phase(min) { if (!this.silent) this.ev.push({ t: 'phase', min: min || 0 }); }

    // ---------- setup ----------
    _parse() {
      const L = this.level;
      const rows = L.board.length;
      const cols = Math.max(...L.board.map((s) => s.length));
      this.rows = rows; this.cols = cols;
      this.cells = [];
      const bossCells = [];
      let presetCrowns = 0;
      for (let r = 0; r < rows; r++) {
        const row = [];
        for (let c = 0; c < cols; c++) {
          const ch = L.board[r][c] || ' ';
          const cell = { p: ch !== ' ' && ch !== '-', floor: 0, block: null, tile: null, tape: 0 };
          if (cell.p) {
            if (ch in COLOR_CHARS) cell.tile = this._newTile('n', COLOR_CHARS[ch]);
            else if (ch in POWER_CHARS) cell.tile = this._newTile('p', -1, POWER_CHARS[ch]);
            else if (ch === '1' || ch === '2' || ch === '3') cell.block = { t: 'crate', hp: +ch };
            else if (ch === 'S') cell.block = { t: 'static' };
            else if (ch === 'K') { cell.block = { t: 'boss' }; bossCells.push([c, r]); }
            else if (ch === 'C') { cell.tile = this._newTile('c'); presetCrowns++; }
          }
          if (cell.p && L.floor && L.floor[r]) {
            const f = L.floor[r][c];
            if (f === '1' || f === '2') cell.floor = +f;
          }
          if (cell.p && L.tape && L.tape[r] && L.tape[r][c] === 'x' && !cell.block) cell.tape = 1;
          row.push(cell);
        }
        this.cells.push(row);
      }
      this.boss = null;
      if (bossCells.length && L.boss) {
        const xs = bossCells.map((p) => p[0]), ys = bossCells.map((p) => p[1]);
        const x = Math.min(...xs), y = Math.min(...ys);
        this.boss = {
          x, y, w: Math.max(...xs) - x + 1, h: Math.max(...ys) - y + 1,
          hp: L.boss.hp, max: L.boss.hp, kind: L.boss.kind,
          every: L.boss.every || 3, attack: L.boss.attack, count: L.boss.count || 2,
          timer: L.boss.every || 3,
        };
      }
      // column helpers
      this.topRow = []; this.botRow = [];
      for (let c = 0; c < cols; c++) {
        let top = -1, bot = -1;
        for (let r = 0; r < rows; r++) if (this.cells[r][c].p) { if (top < 0) top = r; bot = r; }
        this.topRow.push(top); this.botRow.push(bot);
      }
      // crowns
      this.crownCfg = L.crowns || null;
      this.crownSpawned = presetCrowns;
      this.crownCooldown = this.crownCfg ? (this.crownCfg.gap || 2) : 0;
      // goals
      this.goals = L.goals.map((g) => {
        let need = g.count;
        if (need == null) {
          if (g.type === 'crate') need = this._count((cl) => cl.block && cl.block.t === 'crate');
          else if (g.type === 'floor') need = this._count((cl) => cl.floor > 0);
          else if (g.type === 'tape') need = this._count((cl) => cl.tape);
          else if (g.type === 'static') need = this._count((cl) => cl.block && cl.block.t === 'static');
          else if (g.type === 'boss') need = this.boss ? this.boss.hp : 0;
          else if (g.type === 'crown') need = this.crownCfg ? this.crownCfg.total : presetCrowns;
        }
        return { type: g.type, color: g.color, need, left: need };
      });
    }

    _count(pred) {
      let n = 0;
      for (const row of this.cells) for (const cl of row) if (cl.p && pred(cl)) n++;
      return n;
    }

    _newTile(k, col, pw) {
      return { id: this.nid++, k, col: col == null ? -1 : col, pw: pw || null };
    }

    _initialFill() {
      const holes = [];
      for (let r = 0; r < this.rows; r++) for (let c = 0; c < this.cols; c++) {
        const cl = this.cells[r][c];
        if (cl.p && !cl.block && !cl.tile) holes.push([c, r]);
      }
      for (let attempt = 0; attempt < 300; attempt++) {
        for (const [c, r] of holes) this.cells[r][c].tile = null;
        for (const [c, r] of holes) {
          const opts = this.colors.filter((col) => !this._wouldMatch(c, r, col));
          this.cells[r][c].tile = this._newTile('n', opts.length ? this.pick(opts) : this.pick(this.colors));
        }
        if (!this._findGroups().length && this.findMoves(1).length && this._tutorialOk()) return;
      }
    }

    // The scripted tutorial moves must play out exactly as written on this board.
    _tutorialOk() {
      const steps = this.level.tutorial;
      if (!steps) return true;
      const e = this.clone();
      e.silent = true;
      for (const s of steps) {
        const res = s.do === 'swap' ? e.swap(s.a, s.b) : e.tap(s.at);
        if (!res.ok || e.status !== 'playing') return false;
        if (s.expect) {
          const cl = e.cell(s.expect.c, s.expect.r);
          if (!cl || !cl.tile || cl.tile.k !== 'p' || cl.tile.pw !== s.expect.pw) return false;
        }
      }
      return true;
    }

    // Would placing `col` at (c,r) form a line of 3 or a 2x2 with existing tiles?
    _wouldMatch(c, r, col) {
      const mc = (x, y) => this._mc(x, y);
      let n = 1;
      for (let x = c - 1; mc(x, r) === col; x--) n++;
      for (let x = c + 1; mc(x, r) === col; x++) n++;
      if (n >= 3) return true;
      n = 1;
      for (let y = r - 1; mc(c, y) === col; y--) n++;
      for (let y = r + 1; mc(c, y) === col; y++) n++;
      if (n >= 3) return true;
      for (const [dx, dy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
        if (mc(c + dx, r) === col && mc(c, r + dy) === col && mc(c + dx, r + dy) === col) return true;
      }
      return false;
    }

    // Match color of a cell, or -1 when it cannot take part in a match.
    _mc(c, r) {
      if (c < 0 || r < 0 || c >= this.cols || r >= this.rows) return -1;
      const cl = this.cells[r][c];
      if (!cl.p || cl.block || !cl.tile || cl.tile.k !== 'n') return -1;
      return cl.tile.col;
    }

    // ---------- queries ----------
    cell(c, r) {
      if (c < 0 || r < 0 || c >= this.cols || r >= this.rows) return null;
      return this.cells[r][c];
    }

    _swappable(p) {
      const cl = this.cell(p.c, p.r);
      return !!(cl && cl.p && !cl.block && cl.tile && !cl.tape);
    }

    _matchAt(c, r) {
      const col = this._mc(c, r);
      if (col < 0) return false;
      const mc = (x, y) => this._mc(x, y);
      let n = 1;
      for (let x = c - 1; mc(x, r) === col; x--) n++;
      for (let x = c + 1; mc(x, r) === col; x++) n++;
      if (n >= 3) return true;
      n = 1;
      for (let y = r - 1; mc(c, y) === col; y--) n++;
      for (let y = r + 1; mc(c, y) === col; y++) n++;
      if (n >= 3) return true;
      for (const [dx, dy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
        if (mc(c + dx, r) === col && mc(c, r + dy) === col && mc(c + dx, r + dy) === col) return true;
      }
      return false;
    }

    // All legal moves (power-up taps first, then swaps). Stops at `limit`.
    findMoves(limit) {
      limit = limit || Infinity;
      const res = [];
      const { cols, rows, cells } = this;
      const sw = (c, r) => { const x = cells[r][c]; return x.p && !x.block && x.tile && !x.tape; };
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
        if (sw(c, r) && cells[r][c].tile.k === 'p') {
          res.push({ t: 'tap', c, r });
          if (res.length >= limit) return res;
        }
      }
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
        if (!sw(c, r)) continue;
        for (const [dx, dy] of [[1, 0], [0, 1]]) {
          const x = c + dx, y = r + dy;
          if (x >= cols || y >= rows || !sw(x, y)) continue;
          const A = cells[r][c].tile, B = cells[y][x].tile;
          if (A.k === 'p' || B.k === 'p') {
            res.push({ t: 'swap', a: { c, r }, b: { c: x, r: y } });
          } else {
            if (A.k === 'n' && B.k === 'n' && A.col === B.col) continue;
            cells[r][c].tile = B; cells[y][x].tile = A;
            const m = this._matchAt(c, r) || this._matchAt(x, y);
            cells[r][c].tile = A; cells[y][x].tile = B;
            if (m) res.push({ t: 'swap', a: { c, r }, b: { c: x, r: y } });
          }
          if (res.length >= limit) return res;
        }
      }
      return res;
    }

    // A good move to suggest after the player idles.
    hint() {
      const moves = this.findMoves();
      if (!moves.length) return null;
      let best = null, bestScore = -1;
      for (const mv of moves) {
        let score;
        if (mv.t === 'tap') score = 6;
        else {
          const A = this.cells[mv.a.r][mv.a.c], B = this.cells[mv.b.r][mv.b.c];
          if (A.tile.k === 'p' && B.tile.k === 'p') score = 20;
          else if (A.tile.k === 'p' || B.tile.k === 'p') score = 7;
          else {
            const ta = A.tile, tb = B.tile;
            A.tile = tb; B.tile = ta;
            const groups = this._findGroups();
            A.tile = ta; B.tile = tb;
            score = 0;
            for (const g of groups) {
              score += g.cells.size + this._groupValue(g);
              const sh = this._shape(g, [mv.a, mv.b]);
              if (sh.pw) score += sh.pw === 'd' ? 12 : sh.pw === 'x' ? 9 : 6;
            }
          }
        }
        score += Math.random() * 0.5; // never touch the game's own random stream here
        if (score > bestScore) { bestScore = score; best = mv; }
      }
      return best;
    }

    // How much a match group helps the open goals (used to rank hints).
    _groupValue(g) {
      const open = (type, col) => this.goals.some((x) => x.type === type && x.left > 0 && (col == null || x.color === col));
      let v = open('color', g.col) ? g.cells.size * 2 : 0;
      const seen = new Set();
      for (const i of g.cells) {
        const c = i % this.cols, r = (i / this.cols) | 0;
        const cl = this.cells[r][c];
        if (cl.floor > 0 && open('floor')) v += 2;
        if (cl.tape && open('tape')) v += 3;
        for (const [dx, dy] of DIRS) {
          const n = this.cell(c + dx, r + dy);
          if (!n || !n.block) continue;
          const k = (r + dy) * this.cols + c + dx;
          if (seen.has(k)) continue;
          seen.add(k);
          if (n.block.t === 'boss' || (n.block.t === 'crate' && open('crate')) || n.block.t === 'static') v += 3;
        }
      }
      return v;
    }

    goalsDone() { return this.goals.every((g) => g.left <= 0); }

    // ---------- matching ----------
    _findGroups() {
      const { cols, rows } = this;
      const N = cols * rows;
      const colAt = new Int8Array(N);
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) colAt[r * cols + c] = this._mc(c, r);
      const runs = [], squares = [];
      for (let r = 0; r < rows; r++) {
        let c = 0;
        while (c < cols) {
          const col = colAt[r * cols + c];
          if (col < 0) { c++; continue; }
          let e = c + 1;
          while (e < cols && colAt[r * cols + e] === col) e++;
          if (e - c >= 3) {
            const cl = [];
            for (let x = c; x < e; x++) cl.push(r * cols + x);
            runs.push({ dir: 'h', cells: cl, col });
          }
          c = e;
        }
      }
      for (let c = 0; c < cols; c++) {
        let r = 0;
        while (r < rows) {
          const col = colAt[r * cols + c];
          if (col < 0) { r++; continue; }
          let e = r + 1;
          while (e < rows && colAt[e * cols + c] === col) e++;
          if (e - r >= 3) {
            const cl = [];
            for (let y = r; y < e; y++) cl.push(y * cols + c);
            runs.push({ dir: 'v', cells: cl, col });
          }
          r = e;
        }
      }
      for (let r = 0; r < rows - 1; r++) for (let c = 0; c < cols - 1; c++) {
        const i = r * cols + c, col = colAt[i];
        if (col >= 0 && colAt[i + 1] === col && colAt[i + cols] === col && colAt[i + cols + 1] === col) {
          squares.push({ cells: [i, i + 1, i + cols, i + cols + 1], col });
        }
      }
      if (!runs.length && !squares.length) return [];
      const parent = new Int32Array(N).fill(-1);
      const find = (x) => { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; };
      const add = (shape) => {
        const cl = shape.cells;
        for (const i of cl) if (parent[i] === -1) parent[i] = i;
        for (let k = 1; k < cl.length; k++) {
          const a = find(cl[0]), b = find(cl[k]);
          if (a !== b) parent[b] = a;
        }
      };
      runs.forEach(add); squares.forEach(add);
      const groups = new Map();
      const getG = (i) => {
        const root = find(i);
        let g = groups.get(root);
        if (!g) { g = { cells: new Set(), runs: [], squares: [], col: colAt[i] }; groups.set(root, g); }
        return g;
      };
      for (const run of runs) { const g = getG(run.cells[0]); run.cells.forEach((i) => g.cells.add(i)); g.runs.push(run); }
      for (const sq of squares) { const g = getG(sq.cells[0]); sq.cells.forEach((i) => g.cells.add(i)); g.squares.push(sq); }
      return [...groups.values()];
    }

    // Which power-up a match group earns, and where it appears.
    _shape(g, preferred) {
      const cols = this.cols;
      const xy = (i) => ({ c: i % cols, r: (i / cols) | 0 });
      const ok = (p) => !this.cells[p.r][p.c].tape;
      const inG = (p) => g.cells.has(p.r * cols + p.c);
      let pref = null;
      if (preferred) for (const p of preferred) if (p && inG(p) && ok(p)) { pref = { c: p.c, r: p.r }; break; }
      let best = null;
      for (const run of g.runs) if (!best || run.cells.length > best.cells.length) best = run;
      const maxLen = best ? best.cells.length : 0;
      const anyOk = () => { for (const i of g.cells) { const p = xy(i); if (ok(p)) return p; } return null; };
      const mid = (run) => {
        const n = run.cells.length, m = (n - 1) >> 1;
        for (let k = 0; k < n; k++) {
          const idx = m + (k % 2 ? (k + 1) >> 1 : -(k >> 1));
          if (idx < 0 || idx >= n) continue;
          const p = xy(run.cells[idx]);
          if (ok(p)) return p;
        }
        return anyOk();
      };
      let pw = null, at = null;
      if (maxLen >= 5) { pw = 'd'; at = pref || mid(best); }
      else {
        let inter = null;
        for (const h of g.runs) {
          if (h.dir !== 'h') continue;
          for (const v of g.runs) {
            if (v.dir !== 'v') continue;
            for (const i of h.cells) if (v.cells.includes(i)) { inter = xy(i); break; }
            if (inter) break;
          }
          if (inter) break;
        }
        if (inter) { pw = 'x'; at = pref || (ok(inter) ? inter : anyOk()); }
        else if (maxLen === 4) { pw = best.dir === 'h' ? 'h' : 'v'; at = pref || mid(best); }
        else if (g.squares.length) {
          pw = 'pl';
          const sq = g.squares[0].cells.map(xy);
          const order = [sq[2], sq[3], sq[0], sq[1]];
          at = pref || order.find(ok) || anyOk();
        }
      }
      if (pw && !at) pw = null;
      return { pw, at };
    }

    // ---------- goals ----------
    _goalHit(type, col) {
      if (this.encoreMode) return {};
      for (let i = 0; i < this.goals.length; i++) {
        const g = this.goals[i];
        if (g.type !== type || g.left <= 0) continue;
        if (type === 'color' && g.color !== col) continue;
        g.left--;
        return { g: i };
      }
      return {};
    }

    _lightFloor(c, r, at) {
      const cl = this.cells[r][c];
      if (cl.floor > 0) {
        cl.floor--;
        const gh = cl.floor === 0 ? this._goalHit('floor') : {};
        this.emit({ t: 'floor', c, r, n: cl.floor, at, ...gh });
      }
    }

    _damageBlock(c, r, at) {
      const cl = this.cells[r][c];
      const b = cl.block;
      if (!b) return;
      if (b.t === 'crate') {
        b.hp--;
        if (b.hp <= 0) {
          cl.block = null;
          this.emit({ t: 'crate', c, r, hp: 0, at, ...this._goalHit('crate') });
        } else this.emit({ t: 'crate', c, r, hp: b.hp, at });
      } else if (b.t === 'static') {
        cl.block = null;
        this.staticHit = true;
        this.emit({ t: 'static', c, r, on: 0, at, ...this._goalHit('static') });
      } else if (b.t === 'boss') {
        const B = this.boss;
        if (!B || B.hp <= 0) return;
        B.hp--;
        this.emit({ t: 'boss', c, r, hp: B.hp, at, ...this._goalHit('boss') });
        if (B.hp <= 0) {
          for (let y = B.y; y < B.y + B.h; y++) for (let x = B.x; x < B.x + B.w; x++) this.cells[y][x].block = null;
          this.emit({ t: 'bossDie', at: at + 80 });
        }
      }
    }

    // ---------- player actions ----------
    swap(a, b) {
      this.ev = [];
      this.staticHit = false;
      if (this.status !== 'playing') return { ok: false, events: [] };
      if (Math.abs(a.c - b.c) + Math.abs(a.r - b.r) !== 1) return { ok: false, events: [] };
      if (!this._swappable(a) || !this._swappable(b)) return { ok: false, events: [] };
      const A = this.cells[a.r][a.c], B = this.cells[b.r][b.c];
      const ta = A.tile, tb = B.tile;
      const pa = ta.k === 'p', pb = tb.k === 'p';
      A.tile = tb; B.tile = ta;
      if (pa || pb) {
        this.emit({ t: 'swap', a, b, ida: ta.id, idb: tb.id });
        this._useMove();
        this.phase();
        let acts;
        if (pa && pb) acts = [this._comboAct(ta, tb, a, b)];
        else {
          const p = pa ? ta : tb, other = pa ? tb : ta;
          const at = pa ? b : a;
          acts = [{ c: at.c, r: at.r, pw: p.pw, id: p.id, at: 0, color: other.k === 'n' ? other.col : -1 }];
        }
        this._resolve(acts, null, null);
        this._endTurn(true);
        return { ok: true, events: this.ev };
      }
      const groups = this._findGroups();
      if (!groups.length) {
        A.tile = ta; B.tile = tb;
        this.emit({ t: 'swap', a, b, ida: ta.id, idb: tb.id, bad: true });
        return { ok: false, events: this.ev };
      }
      this.emit({ t: 'swap', a, b, ida: ta.id, idb: tb.id });
      this._useMove();
      this.phase();
      this._resolve(null, [b, a], groups);
      this._endTurn(true);
      return { ok: true, events: this.ev };
    }

    tap(p) {
      this.ev = [];
      this.staticHit = false;
      const cl = this.cell(p.c, p.r);
      if (this.status !== 'playing' || !cl || !cl.p || cl.block || !cl.tile || cl.tile.k !== 'p' || cl.tape) {
        return { ok: false, events: [] };
      }
      this._useMove();
      this._resolve([{ c: p.c, r: p.r, pw: cl.tile.pw, id: cl.tile.id, at: 0, color: -1 }], null, null);
      this._endTurn(true);
      return { ok: true, events: this.ev };
    }

    // Boosters never cost a move. Types: hammer, row, col, shuffle.
    booster(type, p) {
      this.ev = [];
      this.staticHit = false;
      if (this.status !== 'playing') return { ok: false, events: [] };
      if (type === 'shuffle') {
        this._shuffle();
        this._endTurn(false);
        return { ok: true, events: this.ev };
      }
      const cl = this.cell(p.c, p.r);
      if (!cl || !cl.p) return { ok: false, events: [] };
      if (type === 'hammer' && !cl.block && !cl.tile && !cl.floor) return { ok: false, events: [] };
      this._resolve([{ c: p.c, r: p.r, pw: type, at: 0 }], null, null);
      this._endTurn(false);
      return { ok: true, events: this.ev };
    }

    addMoves(n) {
      this.moves += n;
      if (this.status === 'lost') this.status = 'playing';
    }

    // After a win, leftover moves become spray cans and everything fires.
    encore() {
      this.ev = [];
      this.encoreMode = true;
      const left = this.moves;
      const cands = [];
      for (let r = 0; r < this.rows; r++) for (let c = 0; c < this.cols; c++) {
        const cl = this.cells[r][c];
        if (cl.p && !cl.block && !cl.tape && cl.tile && cl.tile.k === 'n') cands.push([c, r]);
      }
      this.shuffleArr(cands);
      const n = Math.min(left, cands.length, 14);
      for (let i = 0; i < n; i++) {
        const [c, r] = cands[i];
        const t = this.cells[r][c].tile;
        t.k = 'p'; t.pw = this.rand() < 0.5 ? 'h' : 'v';
        this.emit({ t: 'convert', id: t.id, c, r, pw: t.pw, at: i * 120, encore: 1 });
      }
      this.moves = 0;
      this.emit({ t: 'moves', n: 0, at: n * 120 });
      this.phase(250);
      for (let round = 0; round < 12; round++) {
        const acts = [];
        for (let r = 0; r < this.rows; r++) for (let c = 0; c < this.cols; c++) {
          const cl = this.cells[r][c];
          if (cl.p && !cl.tape && cl.tile && cl.tile.k === 'p') {
            acts.push({ c, r, pw: cl.tile.pw, id: cl.tile.id, at: acts.length * 130, color: -1 });
          }
        }
        if (!acts.length) break;
        this._resolve(acts, null, null);
      }
      this.emit({ t: 'encoreDone' });
      return { events: this.ev, bonus: left };
    }

    // ---------- resolution ----------
    _useMove() {
      this.moves--;
      this.movesUsed++;
      if (this.crownCooldown > 0) this.crownCooldown--;
      this.emit({ t: 'moves', n: this.moves, at: 0 });
    }

    _resolve(acts, preferred, groups) {
      let cascade = 0;
      for (let guard = 0; guard < 60; guard++) {
        if (groups && groups.length) {
          this._processGroups(groups, preferred);
          preferred = null;
          cascade++;
          if (cascade >= 2) this.emit({ t: 'combo', n: cascade, at: 0 });
          this.phase();
        }
        if (acts && acts.length) {
          this._runActivations(acts);
          acts = null;
          this.phase();
        }
        this._gravityAndCollect();
        groups = this._findGroups();
        if (!groups.length) break;
      }
    }

    _processGroups(groups, preferred) {
      const cols = this.cols;
      const dmg = [];
      for (const g of groups) {
        const shape = this._shape(g, preferred);
        const spawn = shape.pw ? shape.at : null;
        const list = [...g.cells].map((i) => [i % cols, (i / cols) | 0]);
        for (const [c, r] of list) {
          const cl = this.cells[r][c];
          this._lightFloor(c, r, 0);
          if (cl.tape) {
            cl.tape = 0;
            this.emit({ t: 'tape', c, r, on: 0, at: 0, ...this._goalHit('tape') });
            continue;
          }
          const t = cl.tile;
          if (!t) continue;
          cl.tile = null;
          const gh = this._goalHit('color', t.col);
          if (spawn) this.emit({ t: 'merge', id: t.id, c, r, to: spawn, col: t.col, at: 0, ...gh });
          else this.emit({ t: 'clear', id: t.id, c, r, col: t.col, at: 0, ...gh });
        }
        const seen = new Set();
        for (const [c, r] of list) {
          for (const [dx, dy] of DIRS) {
            const x = c + dx, y = r + dy;
            const n = this.cell(x, y);
            if (!n || !n.p || !n.block) continue;
            const key = n.block.t === 'boss' ? -1 : y * cols + x;
            if (seen.has(key)) continue;
            seen.add(key);
            dmg.push([x, y]);
          }
        }
        if (spawn) {
          const nt = this._newTile('p', -1, shape.pw);
          this.cells[spawn.r][spawn.c].tile = nt;
          this.emit({ t: 'create', id: nt.id, pw: shape.pw, c: spawn.c, r: spawn.r, at: 170, size: g.cells.size });
        }
      }
      for (const [x, y] of dmg) this._damageBlock(x, y, 60);
    }

    _comboAct(ta, tb, a, b) {
      // ta now sits at b, tb at a. The combo fires where the dragged tile landed.
      const p1 = ta.pw, p2 = tb.pw;
      const rm = [{ c: b.c, r: b.r, id: ta.id }, { c: a.c, r: a.r, id: tb.id }];
      let pw, payload = null;
      if (p1 === 'd' || p2 === 'd') {
        if (p1 === 'd' && p2 === 'd') pw = 'dd';
        else { pw = 'dconv'; payload = p1 === 'd' ? p2 : p1; }
      } else if (p1 === 'pl' || p2 === 'pl') {
        if (p1 === 'pl' && p2 === 'pl') pw = 'plpl';
        else { pw = 'plc'; payload = p1 === 'pl' ? p2 : p1; }
      } else if (p1 === 'x' || p2 === 'x') {
        pw = p1 === 'x' && p2 === 'x' ? 'xx' : 'bigcross';
      } else pw = 'cross';
      return { c: b.c, r: b.r, pw, payload, rm, at: 0, combo: true, from: { c: a.c, r: a.r }, ids: [ta.id, tb.id], pws: [p1, p2] };
    }

    _runActivations(acts) {
      const q = [];
      this._pend = new Map();
      const push = (it) => {
        if (it.kind === 'hit') {
          const k = it.r * this.cols + it.c;
          this._pend.set(k, (this._pend.get(k) || 0) + 1);
        }
        q.push(it);
      };
      for (const a of acts) push({ ...a, kind: 'act' });
      let guard = 0;
      while (q.length && guard++ < 20000) {
        let mi = 0;
        for (let i = 1; i < q.length; i++) if (q[i].at < q[mi].at) mi = i;
        const it = q.splice(mi, 1)[0];
        if (it.kind === 'act') this._activate(it, push);
        else {
          const k = it.r * this.cols + it.c;
          this._pend.set(k, (this._pend.get(k) || 1) - 1);
          this._hit(it.c, it.r, it.at, push);
        }
      }
    }

    _activate(it, push) {
      const { c, r, at } = it;
      if (it.id != null) {
        const cl = this.cell(c, r);
        if (!cl || !cl.tile || cl.tile.id !== it.id) return;
        cl.tile = null;
      }
      if (it.rm) {
        for (const x of it.rm) {
          const cl = this.cells[x.r][x.c];
          if (cl.tile && cl.tile.id === x.id) cl.tile = null;
        }
      }
      const H = (x, y, t) => {
        if (x < 0 || y < 0 || x >= this.cols || y >= this.rows || !this.cells[y][x].p) return;
        push({ kind: 'hit', c: x, r: y, at: t });
      };
      const line = (horiz, x0, y0, t0) => {
        const n = horiz ? this.cols : this.rows;
        H(x0, y0, t0);
        for (let d = 1; d < n; d++) {
          if (horiz) { H(x0 - d, y0, t0 + d * T.SPRAY); H(x0 + d, y0, t0 + d * T.SPRAY); }
          else { H(x0, y0 - d, t0 + d * T.SPRAY); H(x0, y0 + d, t0 + d * T.SPRAY); }
        }
      };
      const ev = { t: 'act', pw: it.pw, c, r, at, id: it.id };
      if (it.combo) { ev.ids = it.ids; ev.from = it.from; ev.pws = it.pws; }
      switch (it.pw) {
        case 'h': case 'row':
          this.emit(ev); line(true, c, r, at + (it.pw === 'row' ? 200 : 0)); break;
        case 'v': case 'col':
          this.emit(ev); line(false, c, r, at + (it.pw === 'col' ? 200 : 0)); break;
        case 'cross':
          this.emit(ev); line(true, c, r, at + 150); line(false, c, r, at + 150); break;
        case 'bigcross':
          this.emit(ev);
          for (let d = -1; d <= 1; d++) { line(true, c, r + d, at + 220); line(false, c + d, r, at + 220); }
          break;
        case 'x':
          this.emit(ev); this._blast(c, r, 2, at + T.BOOM, H); break;
        case 'xx':
          this.emit(ev); this._blast(c, r, 3, at + T.BOOM + 150, H); break;
        case 'hammer':
          this.emit(ev); H(c, r, at + 330); break;
        case 'pl':
          this._plane(it, H, push, null, 0); break;
        case 'plc': {
          const pay = it.payload;
          this._plane(it, H, push, pay, 0);
          break;
        }
        case 'plpl': {
          this.emit({ ...ev, pw: 'plpl' });
          H(c, r, at);
          for (const [dx, dy] of DIRS) H(c + dx, r + dy, at + 40);
          for (let k = 0; k < 3; k++) this._plane({ c, r, at: at + 60 + k * 90 }, H, push, null, 1);
          break;
        }
        case 'd': {
          const col = it.color >= 0 ? it.color : this._commonColor();
          const targets = this._colorCells(col, true);
          targets.sort((p, q2) => (Math.abs(p.c - c) + Math.abs(p.r - r)) - (Math.abs(q2.c - c) + Math.abs(q2.r - r)));
          ev.col = col;
          ev.targets = targets.map((p, i) => ({ c: p.c, r: p.r, at: at + 160 + i * T.DISC }));
          this.emit(ev);
          H(c, r, at);
          ev.targets.forEach((p) => H(p.c, p.r, p.at));
          break;
        }
        case 'dconv': {
          const col = this._commonColor();
          const targets = this._colorCells(col, false);
          targets.sort((p, q2) => (Math.abs(p.c - c) + Math.abs(p.r - r)) - (Math.abs(q2.c - c) + Math.abs(q2.r - r)));
          ev.col = col;
          ev.targets = targets.map((p, i) => ({ c: p.c, r: p.r, at: at + 200 + i * T.CONVERT }));
          this.emit(ev);
          H(c, r, at + 100);
          const base = at + 200 + targets.length * T.CONVERT + 250;
          targets.forEach((p, i) => {
            const t = this.cells[p.r][p.c].tile;
            t.k = 'p';
            t.pw = it.payload === 'h' || it.payload === 'v' ? (this.rand() < 0.5 ? 'h' : 'v') : it.payload;
            t.armed = true;
            this.emit({ t: 'convert', id: t.id, c: p.c, r: p.r, pw: t.pw, at: ev.targets[i].at });
            push({ kind: 'act', c: p.c, r: p.r, pw: t.pw, id: t.id, at: base + i * 110, color: -1 });
          });
          break;
        }
        case 'dd': {
          this.emit(ev);
          for (let y = 0; y < this.rows; y++) for (let x = 0; x < this.cols; x++) {
            const d = Math.hypot(x - c, y - r);
            H(x, y, at + 250 + d * 55);
          }
          break;
        }
        default:
          break;
      }
    }

    _blast(c, r, rad, t0, H) {
      for (let dy = -rad; dy <= rad; dy++) for (let dx = -rad; dx <= rad; dx++) {
        if (Math.abs(dx) === rad && Math.abs(dy) === rad) continue;
        const d = Math.max(Math.abs(dx), Math.abs(dy));
        H(c + dx, r + dy, t0 + d * T.RING);
      }
    }

    _plane(it, H, push, payload, sub) {
      const { c, r, at } = it;
      if (!sub) {
        H(c, r, at);
        for (const [dx, dy] of DIRS) H(c + dx, r + dy, at + 40);
      }
      const tgt = this._planeTarget(c, r);
      const ev = { t: 'act', pw: 'pl', c, r, at, id: sub ? null : it.id, to: tgt, payload, dur: T.PLANE };
      if (it.combo) { ev.ids = it.ids; ev.from = it.from; ev.pws = it.pws; }
      this.emit(ev);
      if (!tgt) return;
      if (payload) push({ kind: 'act', c: tgt.c, r: tgt.r, pw: payload, at: at + T.PLANE, color: -1 });
      else H(tgt.c, tgt.r, at + T.PLANE);
    }

    _planeTarget(c0, r0) {
      const { cols, rows, cells } = this;
      const pending = (x, y) => (this._pend.get(y * cols + x) || 0) > 0;
      const goalLeft = (type) => this.goals.some((g) => g.type === type && g.left > 0);
      const tiers = [];
      if (this.boss && this.boss.hp > 0) tiers.push({ f: (cl) => cl.block && cl.block.t === 'boss', dup: true });
      if (goalLeft('static') || this._count((cl) => cl.block && cl.block.t === 'static') > 0) {
        tiers.push({ f: (cl) => cl.block && cl.block.t === 'static' });
      }
      if (goalLeft('crate')) tiers.push({ f: (cl) => cl.block && cl.block.t === 'crate' });
      if (goalLeft('floor')) tiers.push({ f: (cl) => cl.floor > 0 && !cl.block && !(cl.tile && cl.tile.k === 'p') });
      if (goalLeft('tape')) tiers.push({ f: (cl) => cl.tape && !cl.block });
      if (goalLeft('crown')) {
        tiers.push({ f: (cl, x, y) => y > 0 && cl.tile && cl.tile.k === 'n' && !cl.tape && cells[y - 1][x].tile && cells[y - 1][x].tile.k === 'c' });
      }
      const need = this.goals.filter((g) => g.type === 'color' && g.left > 0).map((g) => g.color);
      if (need.length) tiers.push({ f: (cl) => cl.tile && cl.tile.k === 'n' && !cl.block && need.includes(cl.tile.col) });
      tiers.push({ f: (cl) => cl.tile && cl.tile.k === 'n' && !cl.block });
      for (const tier of tiers) {
        const list = [];
        for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
          const cl = cells[y][x];
          if (!cl.p || (x === c0 && y === r0)) continue;
          if (Math.abs(x - c0) + Math.abs(y - r0) <= 1) continue;
          if (!tier.dup && pending(x, y)) continue;
          if (tier.f(cl, x, y)) list.push({ c: x, r: y });
        }
        if (list.length) return this.pick(list);
      }
      return null;
    }

    _hit(c, r, at, push) {
      const cl = this.cells[r][c];
      if (!cl.p) return;
      if (cl.block) { this._damageBlock(c, r, at); return; }
      const t = cl.tile;
      if (t) {
        if (cl.tape) {
          cl.tape = 0;
          this.emit({ t: 'tape', c, r, on: 0, at, ...this._goalHit('tape') });
          return;
        }
        if (t.k === 'p') {
          if (!t.armed) {
            t.armed = true;
            push({ kind: 'act', c, r, pw: t.pw, id: t.id, at: at + T.FUSE, color: -1 });
          }
          return;
        }
        if (t.k === 'n') {
          cl.tile = null;
          this.emit({ t: 'clear', id: t.id, c, r, col: t.col, at, hit: 1, ...this._goalHit('color', t.col) });
        }
      }
      this._lightFloor(c, r, at);
    }

    _commonColor() {
      const n = new Array(6).fill(0);
      for (const row of this.cells) for (const cl of row) {
        if (cl.p && !cl.block && cl.tile && cl.tile.k === 'n') n[cl.tile.col]++;
      }
      // Prefer colors the goals still need.
      for (const g of this.goals) if (g.type === 'color' && g.left > 0 && n[g.color] > 0) n[g.color] += 100;
      let best = -1, bestN = -1;
      for (const col of this.colors) {
        const v = n[col] + this.rand() * 0.5;
        if (v > bestN) { bestN = v; best = col; }
      }
      return best;
    }

    _colorCells(col, includeTaped) {
      const out = [];
      for (let r = 0; r < this.rows; r++) for (let c = 0; c < this.cols; c++) {
        const cl = this.cells[r][c];
        if (cl.p && !cl.block && cl.tile && cl.tile.k === 'n' && cl.tile.col === col && (includeTaped || !cl.tape)) out.push({ c, r });
      }
      return out;
    }

    // ---------- gravity ----------
    _gravityAndCollect() {
      for (let guard = 0; guard < 30; guard++) {
        const moved = this._gravity();
        if (moved) this.phase();
        if (!this._collectCrowns()) break;
        this.phase();
      }
    }

    _gravity() {
      const { cols, rows, cells } = this;
      const paths = new Map();
      const spawnN = new Array(cols).fill(0);
      let step = 0, any = false;
      const rec = (t, fc, fr, tc, tr, spawned) => {
        let p = paths.get(t.id);
        if (!p) {
          p = { id: t.id, path: [[fc, fr]], step };
          if (spawned) p.spawn = { k: t.k, col: t.col, pw: t.pw };
          paths.set(t.id, p);
        }
        p.path.push([tc, tr]);
      };
      // Boss cells let tiles pass behind them; every other block is solid.
      const solid = (cl) => (cl.block && cl.block.t !== 'boss') || (cl.tile && cl.tape);
      for (let iter = 0; iter < 400; iter++) {
        let changed = false;
        for (let c = 0; c < cols; c++) {
          for (let r = rows - 1; r >= 0; r--) {
            const cl = cells[r][c];
            if (!cl.p || cl.block || cl.tile) continue;
            let src = -1, blocked = false;
            for (let rr = r - 1; rr >= 0; rr--) {
              const a = cells[rr][c];
              if (!a.p) continue;
              if (solid(a)) { blocked = true; break; }
              if (a.block) continue; // boss
              if (a.tile) { src = rr; break; }
            }
            if (src >= 0) {
              const t = cells[src][c].tile;
              cells[src][c].tile = null;
              cl.tile = t;
              rec(t, c, src, c, r, false);
              changed = true;
            } else if (!blocked) {
              const t = this._spawnTile();
              const sy = this.topRow[c] - 1 - spawnN[c]++;
              cl.tile = t;
              rec(t, c, sy, c, r, true);
              changed = true;
            }
          }
        }
        if (changed) { any = true; step++; continue; }
        let moved = false;
        for (let r = rows - 1; r >= 1 && !moved; r--) {
          for (let k = 0; k < cols && !moved; k++) {
            const c = iter & 1 ? cols - 1 - k : k;
            const cl = cells[r][c];
            if (!cl.p || cl.block || cl.tile) continue;
            const order = iter & 1 ? [1, -1] : [-1, 1];
            for (const dc of order) {
              const sc = c + dc;
              if (sc < 0 || sc >= cols) continue;
              const s = cells[r - 1][sc];
              if (!s.p || s.block || !s.tile || s.tape) continue;
              const t = s.tile;
              s.tile = null;
              cl.tile = t;
              rec(t, sc, r - 1, c, r, false);
              moved = true;
              break;
            }
          }
        }
        if (!moved) break;
        any = true; step++;
      }
      if (any) this.emit({ t: 'fall', moves: [...paths.values()] });
      return any;
    }

    _spawnTile() {
      const cfg = this.crownCfg;
      if (cfg && !this.encoreMode && this.crownSpawned < cfg.total && this.crownCooldown <= 0 &&
          this._count((cl) => cl.tile && cl.tile.k === 'c') < (cfg.max || 1)) {
        this.crownSpawned++;
        this.crownCooldown = cfg.gap || 2;
        return this._newTile('c');
      }
      return this._newTile('n', this.pick(this.colors));
    }

    _collectCrowns() {
      let got = false;
      for (let c = 0; c < this.cols; c++) {
        const r = this.botRow[c];
        if (r < 0) continue;
        const cl = this.cells[r][c];
        if (cl.tile && cl.tile.k === 'c' && !cl.tape && !cl.block) {
          const t = cl.tile;
          cl.tile = null;
          got = true;
          this.emit({ t: 'collect', id: t.id, c, r, at: 0, ...this._goalHit('crown') });
        }
      }
      return got;
    }

    // ---------- end of turn ----------
    _endTurn(usedMove) {
      if (this.goalsDone()) {
        this.status = 'won';
        this.emit({ t: 'won' });
        return;
      }
      if (usedMove) {
        let changed = false;
        if (this.level.spread && !this.staticHit) changed = this._spreadStatic() || changed;
        if (this.boss && this.boss.hp > 0) {
          this.boss.timer--;
          if (this.boss.timer <= 0) {
            this.boss.timer = this.boss.every;
            changed = this._bossAttack() || changed;
          }
          this.emit({ t: 'bossTimer', n: this.boss.timer });
        }
        if (changed) this.phase(120);
      }
      this.staticHit = false;
      if (this.moves <= 0) {
        this.status = 'lost';
        this.emit({ t: 'lost' });
        return;
      }
      if (!this.findMoves(1).length) this._shuffle();
    }

    // For every cell: would a falling tile reach it if it were empty right now?
    // Covers obstacle cells too, so we know whether clearing them leaves a hole.
    _fillMap() {
      const { cols, rows, cells } = this;
      const solid = (cl) => (cl.block && cl.block.t !== 'boss') || cl.tape;
      const fill = [];
      for (let r = 0; r < rows; r++) {
        const row = new Array(cols).fill(false);
        for (let c = 0; c < cols; c++) {
          if (!cells[r][c].p) continue;
          let up = r - 1;
          while (up >= 0 && !cells[up][c].p) up--;
          let ok = up < 0 || (!solid(cells[up][c]) && fill[up][c]);
          if (!ok && r > 0) {
            for (const dc of [-1, 1]) {
              const x = c + dc;
              if (x < 0 || x >= cols) continue;
              const s = cells[r - 1][x];
              if (s.p && !s.block && !s.tape && fill[r - 1][x]) { ok = true; break; }
            }
          }
          row[c] = ok;
        }
        fill.push(row);
      }
      return fill;
    }

    // Would turning (c,r) solid leave some cell below it unable to refill?
    _traps(c, r, mutate) {
      const before = this._fillMap();
      const cl = this.cells[r][c];
      const saved = { block: cl.block, tape: cl.tape };
      mutate(cl);
      const after = this._fillMap();
      cl.block = saved.block; cl.tape = saved.tape;
      for (let y = r + 1; y < this.rows; y++) {
        for (let x = 0; x < this.cols; x++) if (before[y][x] && !after[y][x]) return true;
      }
      return false;
    }

    _spreadStatic() {
      const opts = [];
      for (let r = 0; r < this.rows; r++) for (let c = 0; c < this.cols; c++) {
        const cl = this.cells[r][c];
        if (!cl.block || cl.block.t !== 'static') continue;
        for (const [dx, dy] of DIRS) {
          const n = this.cell(c + dx, r + dy);
          if (n && n.p && !n.block && !n.tape && n.tile && n.tile.k === 'n' &&
              !this._traps(c + dx, r + dy, (x) => { x.block = { t: 'static' }; })) {
            opts.push([c + dx, r + dy, c, r]);
          }
        }
      }
      if (!opts.length) return false;
      const [x, y, fx, fy] = this.pick(opts);
      const cl = this.cells[y][x];
      const t = cl.tile;
      cl.tile = null;
      cl.block = { t: 'static' };
      const gi = this.goals.findIndex((g) => g.type === 'static');
      if (gi >= 0) this.goals[gi].left++;
      this.emit({ t: 'spread', c: x, r: y, from: { c: fx, r: fy }, id: t.id, g: gi >= 0 ? gi : undefined, at: 0 });
      return true;
    }

    _bossAttack() {
      const B = this.boss;
      const opts = [];
      for (let r = 0; r < this.rows; r++) for (let c = 0; c < this.cols; c++) {
        const cl = this.cells[r][c];
        if (cl.p && !cl.block && !cl.tape && cl.tile && cl.tile.k === 'n') opts.push({ c, r });
      }
      this.shuffleArr(opts);
      const mutate = (cl) => {
        if (B.attack === 'tape') cl.tape = 1;
        else cl.block = B.attack === 'static' ? { t: 'static' } : { t: 'crate', hp: 1 };
      };
      const targets = [];
      for (const p of opts) {
        if (targets.length >= B.count) break;
        if (this._traps(p.c, p.r, mutate)) continue;
        const cl = this.cells[p.r][p.c];
        const at = 350 + targets.length * 140;
        if (B.attack === 'tape') {
          cl.tape = 1;
          targets.push({ c: p.c, r: p.r, at });
        } else {
          const t = cl.tile;
          cl.tile = null;
          mutate(cl);
          targets.push({ c: p.c, r: p.r, at, id: t.id });
        }
      }
      if (!targets.length) return false;
      this.emit({ t: 'bossAttack', kind: B.attack, targets, at: 0 });
      return true;
    }

    _shuffle() {
      const pos = [], tiles = [];
      for (let r = 0; r < this.rows; r++) for (let c = 0; c < this.cols; c++) {
        const cl = this.cells[r][c];
        if (cl.p && !cl.block && !cl.tape && cl.tile && cl.tile.k === 'n') { pos.push([c, r]); tiles.push(cl.tile); }
      }
      let ok = false;
      if (pos.length >= 3) {
        for (let attempt = 0; attempt < 250 && !ok; attempt++) {
          this.shuffleArr(tiles);
          pos.forEach(([c, r], i) => { this.cells[r][c].tile = tiles[i]; });
          ok = !this._findGroups().length && this.findMoves(1).length > 0;
        }
        for (let attempt = 0; attempt < 80 && !ok; attempt++) {
          for (const [c, r] of pos) this.cells[r][c].tile.col = -1;
          for (const [c, r] of pos) {
            const t = this.cells[r][c].tile;
            t.col = -1;
            const opts = this.colors.filter((col) => !this._wouldMatch(c, r, col));
            t.col = opts.length ? this.pick(opts) : this.pick(this.colors);
          }
          ok = !this._findGroups().length && this.findMoves(1).length > 0;
        }
      }
      this.emit({
        t: 'shuffle',
        moves: pos.map(([c, r]) => ({ id: this.cells[r][c].tile.id, c, r, col: this.cells[r][c].tile.col })),
      });
      if (!ok || !this.findMoves(1).length) {
        // Nothing can be arranged into a move: hand the player a free spray can.
        const cands = pos.length ? pos : [];
        if (cands.length) {
          const [c, r] = this.pick(cands);
          const t = this.cells[r][c].tile;
          t.k = 'p'; t.pw = 'h';
          this.emit({ t: 'convert', id: t.id, c, r, pw: 'h', at: 500 });
        }
      }
      this.phase(150);
    }

    // ---------- cloning (for the balancing bot) ----------
    clone() {
      const e = Object.create(Engine.prototype);
      Object.assign(e, this);
      e.cells = this.cells.map((row) => row.map((cl) => ({
        p: cl.p, floor: cl.floor, tape: cl.tape,
        block: cl.block ? { ...cl.block } : null,
        tile: cl.tile ? { ...cl.tile } : null,
      })));
      e.goals = this.goals.map((g) => ({ ...g }));
      e.boss = this.boss ? { ...this.boss } : null;
      e.colors = this.colors.slice();
      e.ev = [];
      e._pend = new Map();
      return e;
    }
  }

  return { Engine, T };
});

<script>
/*
 * Rhyme Kingdom: artwork.
 * Everything is vector SVG generated in code (no external files), so the
 * game stays one self-contained page. Tiles and power-ups are rasterized
 * onto canvas sprites by the renderer; portraits and scenes are inlined.
 */
(function (root) {
  'use strict';

  const OL = '#1d0f33'; // outline ink
  let uid = 0;
  const id = (p) => `${p}${++uid}`;

  const svg = (body, vb = '0 0 100 100', w = 256, h = 256) =>
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb}" width="${w}" height="${h}">${body}</svg>`;
  const lin = (gid, stops, x2 = 0, y2 = 1) =>
    `<linearGradient id="${gid}" x1="0" y1="0" x2="${x2}" y2="${y2}">${stops.map((s) => `<stop offset="${s[0]}" stop-color="${s[1]}"/>`).join('')}</linearGradient>`;
  const rad = (gid, stops, cx = '38%', cy = '32%', r = '72%') =>
    `<radialGradient id="${gid}" cx="${cx}" cy="${cy}" r="${r}">${stops.map((s) => `<stop offset="${s[0]}" stop-color="${s[1]}"/>`).join('')}</radialGradient>`;
  const shadow = (cx = 50, cy = 91, rx = 30, ry = 5) =>
    `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="#000" opacity=".22"/>`;
  const star = (cx, cy, R, r, n = 5, rot = -90) => {
    let d = '';
    for (let i = 0; i < n * 2; i++) {
      const a = ((rot + (i * 180) / n) * Math.PI) / 180;
      const rr = i % 2 ? r : R;
      d += `${i ? 'L' : 'M'}${(cx + rr * Math.cos(a)).toFixed(2)} ${(cy + rr * Math.sin(a)).toFixed(2)}`;
    }
    return d + 'Z';
  };

  // ------------------------------------------------------------------ tiles
  function mic() {
    const h = id('h'), b = id('b'), g = id('g'), cp = id('c');

  function staticNoise(seed, x, y, w, h, cell, colors) {
    let s = seed;
    const r = () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
    let out = '';
    for (let yy = y; yy < y + h; yy += cell) {
      for (let xx = x; xx < x + w; xx += cell) {
        if (r() < 0.55) out += `<rect x="${xx}" y="${yy}" width="${cell}" height="${cell}" fill="${colors[Math.floor(r() * colors.length)]}"/>`;
      }
    }
    return out;
  }

      const lit = r() < 0.55;

<script>
/*

(function (root) {
  'use strict';

  const NEON = ['#ff3b8d', '#22e3ff', '#ffc531', '#3bff8a', '#b05cff'];

  const CALLOUT = { 2: 'FRESH!', 3: 'DOPE!', 4: 'FIRE!', 5: 'FIRE!' };
  const COMBO_NAME = { cross: 'CROSSFADE!', bigcross: 'BASS CROSS!', xx: 'DOUBLE DROP!', dd: 'DOUBLE PLATINUM!', dconv: 'REMIX!', plpl: 'AIRMAIL!', plc: 'SPECIAL DELIVERY!' };

  class BoardView {
    constructor(canvas, fxCanvas, hooks) {

      this.img = {};
      this.cache = new Map();
      this.sprites = new Map();

      this.parts = [];
      this.effects = [];
      this.texts = [];
      this.flyers = [];

    async init() {

      for (let c = 0; c < 6; c++) add('t' + c, Art.tileUrl(c));
      for (const p of ['h', 'v', 'x', 'pl', 'd']) add(p, Art.powerUrl(p));
      add('crown', Art.crownUrl());
      for (let h = 1; h <= 3; h++) add('c' + h, Art.crateUrl(h));
      add('tape', Art.tapeUrl());
      add('floor', Art.floorUrl());
      for (let k = 0; k < 4; k++) add('static' + k, Art.staticUrl(k * 7 + 3));

      add('row', Art.iconUrl('row'));

    // ------------------------------------------------------------- level setup
    load(eng) {

    _newSprite(id, k, col, pw, x, y) {
      const sp = { id, k, col, pw, x, y, s: 1, a: 1, rot: 0, z: 0, path: null, v: 0, delay: 0, sq: 0, flash: 0 };
      this.sprites.set(id, sp);

    }

    layout() {
      const wrap = this.cv.parentElement;
      const rect = wrap.getBoundingClientRect();
      const dpr = Math.min(root.devicePixelRatio || 1, 3);
      this.dpr = dpr;
      this.W = Math.max(1, rect.width); this.H = Math.max(1, rect.height);
      this.cv.width = Math.round(this.W * dpr); this.cv.height = Math.round(this.H * dpr);
      const app = this.fx.parentElement.getBoundingClientRect();
      this.fx.width = Math.round(app.width * dpr); this.fx.height = Math.round(app.height * dpr);
      this.FW = app.width; this.FH = app.height;
      this.offX = rect.left - app.left; this.offY = rect.top - app.top;
      this.cache.clear();
      if (!this.eng) return;
      const S = Math.floor(Math.min((this.W - 4) / this.cols, (this.H - 4) / this.rows, 66));
      this.S = Math.max(16, S);
      this.ox = Math.round((this.W - this.S * this.cols) / 2);
      this.oy = Math.round((this.H - this.S * this.rows) / 2);

    _buildBg() {
      const { S, ox, oy, dpr } = this;
      const bg = document.createElement('canvas');
      bg.width = Math.round(this.W * dpr); bg.height = Math.round(this.H * dpr);
      const g = bg.getContext('2d');
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      const cells = [];
      for (let r = 0; r < this.rows; r++) for (let c = 0; c < this.cols; c++) if (this.v[r][c].p) cells.push([c, r]);
      const pass = (grow, rad, fill, extra) => {
        g.save();

        g.fillStyle = fill;
        g.beginPath();

      const grad = g.createLinearGradient(0, oy - 10, 0, oy + this.rows * S + 10);
      grad.addColorStop(0, '#ffd34d'); grad.addColorStop(0.5, '#ff7ab6'); grad.addColorStop(1, '#22e3ff');
      pass(7, 12, grad);
      pass(4, 9, '#140826');

    // ------------------------------------------------------------ geometry
    center(c, r) { return { x: this.ox + (c + 0.5) * this.S, y: this.oy + (r + 0.5) * this.S }; }

    cellAt(px, py) {

    // Sprites are cached at power-of-two resolutions and scaled on draw, so
    // animated sizes never create new bitmaps (the cache stays tiny).
    _spr(key, w, h) {

      const px = Math.min(1024, Math.max(32, Math.pow(2, Math.ceil(Math.log2(Math.max(1, want))))));

    // --------------------------------------------------------------- timing

    apply(ev) {

        case 'swap': return this._swap(ev);
        case 'moves': this.after(at, () => this.hooks.setMoves(ev.n)); return null;
        case 'clear': return this.after(at, () => this._clear(ev));
        case 'merge': return this._merge(ev);
        case 'create': return this.after(at, () => this._create(ev));
        case 'floor': return this.after(at, () => this._floor(ev));
        case 'crate': return this.after(at, () => this._crate(ev));
        case 'static': return this.after(at, () => this._staticGone(ev));
        case 'tape': return this.after(at, () => this._tape(ev));

        this.tween(B, { x: ev.a.c, y: ev.a.r }, 0.13, ease.inOut),

    _clear(ev) {
      const sp = this.sprites.get(ev.id);

    _merge(ev) {

      const p = this.center(ev.c, ev.r);
      if (ev.g != null) this.flyToGoal(ev.g, 't' + ev.col, p.x, p.y);

      sp.z = 2;
      return this.tween(sp, { x: ev.to.c, y: ev.to.r, s: 0.7 }, 0.15, ease.in).then(() => this.sprites.delete(ev.id));

    _create(ev) {

      return this.tween(sp, { s: 1.25 }, 0.13, ease.out).then(() => this.tween(sp, { s: 1 }, 0.12, ease.inOut)).then(() => { sp.z = 0; });
    }

    _floor(ev) {
      const cl = this.v[ev.r][ev.c];
      cl.floor = ev.n;
      const p = this.center(ev.c, ev.r);
      if (ev.n === 0) {
        cl.lit = true; cl.litT = this.time;
        this.sparkle(p.x, p.y, 6);
        if (this.time - this.lastFloor > 0.05) { this.lastFloor = this.time; Snd.fx('floor'); }
      } else {
        this.ring(p.x, p.y, this.S * 0.2, this.S * 0.7, 0.3, '#ff7ab6', 3);
      }

    }

    _crate(ev) {
      const cl = this.v[ev.r][ev.c];
      const p = this.center(ev.c, ev.r);
      Snd.fx('crate');

      this.debris(p.x, p.y, col, ev.hp ? 6 : 12);
      if (ev.hp > 0) { if (cl.block) cl.block.hp = ev.hp; cl.hitT = this.time; }
      else {
        cl.block = null;
        for (let i = 0; i < 3; i++) this.part({ x: p.x, y: p.y, vx: (Math.random() - 0.5) * 260, vy: -180 - Math.random() * 160, g: 900, life: 0.9, size: this.S * 0.22, color: NEON[i % 5], shape: 'disc', vr: (Math.random() - 0.5) * 12 });

    }

    _staticGone(ev) {
      const cl = this.v[ev.r][ev.c];

        this.part({ x: p.x + (Math.random() - 0.5) * this.S * 0.6, y: p.y + (Math.random() - 0.5) * this.S * 0.6, vx: (Math.random() - 0.5) * 220, vy: (Math.random() - 0.5) * 220, g: 0, life: 0.45, size: this.S * 0.09, color: ['#fff', '#cfc4f5', '#7b66b8'][i % 3], shape: 'sq' });
      }

    }

    _tape(ev) {
      const cl = this.v[ev.r][ev.c];
      cl.tape = 0;
      const p = this.center(ev.c, ev.r);
      Snd.fx('tape');
      for (let i = 0; i < 4; i++) {
        this.part({ x: p.x, y: p.y, vx: (i % 2 ? 1 : -1) * (120 + Math.random() * 120), vy: -120 - Math.random() * 140, g: 700, life: 0.7, size: this.S * 0.42, color: i % 2 ? '#b9b3cc' : '#d6d1e6', shape: 'strip', rot: Math.random() * 3, vr: (Math.random() - 0.5) * 10 });
      }
      if (ev.g != null) this.flyToGoal(ev.g, 'tape', p.x, p.y);
    }

    _bossHit(ev) {
      const B = this.boss;
      if (!B) return;
      B.hp = ev.hp; B.flash = 1; B.shake = 1;
      const p = this.center(ev.c, ev.r);
      this.text('-1', p.x, p.y - this.S * 0.2, this.S * 0.55, '#ff3b5c', 0.7, 50);
      this.burst(p.x, p.y, '#b05cff', 5);
      if (this.time - (B.lastSnd || 0) > 0.06) { B.lastSnd = this.time; Snd.fx('bossHit'); }
      if (ev.g != null) this.hooks.goalTick(ev.g, -1);
    }

    _bossDie() {
      const B = this.boss;
      if (!B) return;
      B.dead = true; B.deadT = this.time;
      const p = this.center(B.x + B.w / 2 - 0.5, B.y + B.h / 2 - 0.5);
      Snd.fx('boom'); Snd.fx('horn', 3);
      this.shakeAmp = 18;
      for (let k = 0; k < 3; k++) this.ring(p.x, p.y, this.S * 0.5, this.S * (3 + k * 1.5), 0.5 + k * 0.15, NEON[k], 6);
      this.burst(p.x, p.y, '#b05cff', 30);
      this.sparkle(p.x, p.y, 30);
      this.text('MIC DROP!', this.W / 2, this.oy + this.rows * this.S * 0.45, Math.min(this.W / 6, 70), '#ffc531', 1.6);

      for (let y = B.y; y < B.y + B.h; y++) for (let x = B.x; x < B.x + B.w; x++) this.v[y][x].block = null;

    }

    _bossAttack(ev) {
      const B = this.boss;
      if (!B) return null;
      Snd.fx('bossAttack');
      B.wind = 1;
      const from = this.center(B.x + B.w / 2 - 0.5, B.y + B.h / 2 - 0.5);
      const names = { crate: 'CRATE DROP!', tape: 'TAPED UP!', static: 'STATIC!' };
      this.text(names[ev.kind] || 'ATTACK!', from.x, from.y + this.S * B.h * 0.6, this.S * 0.6, '#ff3b5c', 1.1);
